name: Automated ML Pipeline
on:
   push:
     branches: ["main"]
   pull_request:
     branches: ["main"]
jobs:
    run-preprocessing:
       runs-on: ubuntu-latest
       steps:
#1.Chesckout repository code
            - name: Checkout Repository Code
              uses: actions/checkout@v4
#2.Set up Python enviroment
            - name: Set Up Python
              uses: action/setup-python@v5
              with:
                    python-version: "3.10"
                    cache: 'pip'
 #3.Install project dependencies
            - name: install Dependencies
              run: python-m pipi install--upgrade pip
                 pip install pandas scikit-leran pytest
 #4.Run your preprocessing or test script
            - name: Run Preprocessing & Tests
              run: python preprocessing.py
