name : Automated Model Training
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  train_model:
    runs-on: ubuntu-latest
    steps:
       - name: Checkout Repository Code
         uses: actions/checkout@v4
       - name: Check Repository Files
         run: |
          echo"Current directory:"
          pwd
          echo"Files in repository root:"
          Is -Ia
          echo "Searching for test_model.py:"
          find.-name "test_mode.py"
        - name: Checkout Repository Code
          uses: action/checkout@v4
        - name: Set up Python
          uses: action/setup-python@v5
          with:
            python-version:'3.10'
        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install pandas numpy scikit-learn joblib pytest
        - name: Execute Model Traning
          run: python train.py
        - name: Execute Model Tests
          run: pytest -v test_model.py
        - name: Execute Model Inference
          run: python predict.py
        - name: Upload Trained Model
          uses: action/upload-artifact@v4
          with:
            name: training-ml-model
            path: best-model.joblib
